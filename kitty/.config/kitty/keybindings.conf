# window management
map ctrl+shift+enter launch --type=window --add-to-session=.
map alt+ctrl+shift+enter new_window_with_cwd
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
map ctrl+shift+s swap_with_window
map ctrl+shift+r start_resizing_window
map ctrl+shift+n set_window_title

# layouts
map alt+t next_layout
map alt+z toggle_layout stack

# tabs
map alt+enter launch --type=tab --add-to-session=.
map alt+shift+enter new_tab_with_cwd
map alt+h previous_tab
map alt+shift+h move_tab_backward
map alt+l next_tab
map alt+shift+l move_tab_forward
map alt+n set_tab_title
map alt+m detach_window ask
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10

# sessions (files in ~/.local/share/kitty/sessions, not tracked)
map alt+o goto_session ~/.local/share/kitty/sessions
map alt+p>x close_session .
map alt+p>s save_as_session --use-foreground-process --match=session:^$ --base-dir ~/.local/share/kitty/sessions
map alt+p>u save_as_session --use-foreground-process --match=session:. .
