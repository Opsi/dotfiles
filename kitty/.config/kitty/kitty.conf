# kitty config — only non-default settings, see https://sw.kovidgoyal.net/kitty/conf/

# BEGIN_KITTY_THEME
include everforest-dark-hard.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="FiraCode Nerd Font"
# END_KITTY_FONTS

enabled_layouts fat,horizontal,grid,stack

# cursor trail
cursor_trail 100
cursor_trail_start_threshold 2
cursor_trail_decay 0.2 0.5

include keybindings.conf
include styling.conf

startup_session ~/.local/share/kitty/sessions/notes.kitty-session
